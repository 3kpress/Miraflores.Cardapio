<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cozinha - Brasa de Miraflores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e7eb; overflow: hidden; font-family: 'Roboto', sans-serif;}
        .grid-cozinha { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px; }
        .card-pedido { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; overflow: hidden; position: relative; transition: all 0.3s ease; }
        
        .status-pendente { border-top: 6px solid #f59e0b; }
        .status-preparo { border-top: 6px solid #3b82f6; }
        .status-pronto { border-top: 6px solid #a855f7; } 
        .status-finalizado { border-top: 6px solid #22c55e; }
        
        .new-order-pulse { animation: shadow-pulse 1.5s infinite; }
        @keyframes shadow-pulse { 0% { box-shadow: 0 0 0 0px rgba(245, 158, 11, 0.4); } 100% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); } }
        
        header { height: 75px; }
        main { height: calc(100vh - 75px); }

        #dashboard-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50; backdrop-filter: blur(8px); overflow-y: auto; padding: 20px 0; }
        .dashboard-content { background: #121212; border: 1px solid #333; max-width: 1000px; margin: 0 auto; border-radius: 12px; display: flex; flex-direction: column; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-zinc-900 px-6 py-3 border-b border-zinc-800 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-black text-amber-500 uppercase tracking-tighter">COZINHA</h1>
            <span id="contador-pedidos" class="bg-zinc-800 text-amber-500 px-3 py-1 rounded border border-zinc-700 text-lg font-bold">0 ATIVAS</span>
        </div>
        <div class="flex items-center gap-6">
            <button onclick="abrirDashboard()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-bold uppercase transition flex items-center gap-2">
                <i class="fas fa-chart-line"></i> Dashboard Vendas
            </button>
            <div class="flex flex-col text-right ml-4 border-l border-zinc-700 pl-6">
                <span class="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Faturamento Hoje</span>
                <span id="faturamento-hoje" class="text-2xl text-green-500 font-black">0,00€</span>
            </div>
            <div id="status-conexao" class="text-xs text-gray-500 uppercase font-bold text-right ml-4 w-24">● Sincronizado</div>
        </div>
    </header>

    <main class="overflow-y-auto bg-black relative">
        <div class="grid-cozinha" id="pedidos-container"></div>
    </main>

    <!-- MODAL DASHBOARD -->
    <div id="dashboard-modal">
        <div class="dashboard-content shadow-2xl">
            <div class="flex justify-between items-center p-6 border-b border-zinc-800">
                <h2 class="text-2xl font-black text-white"><i class="fas fa-chart-pie text-blue-500 mr-2"></i> Relatório de Faturamento</h2>
                <div class="flex items-center gap-4">
                    <button onclick="baixarRelatorio()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded font-bold uppercase text-xs transition flex items-center gap-2">
                        <i class="fas fa-file-excel"></i> Exportar
                    </button>
                    <button onclick="fecharDashboard()" class="text-zinc-500 hover:text-white text-3xl leading-none">&times;</button>
                </div>
            </div>
            
            <div class="p-6 bg-zinc-900 flex gap-4">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-1">Data Início</label>
                    <input type="date" id="data-inicio" class="w-full bg-black border border-zinc-700 rounded p-3 text-white outline-none focus:border-blue-500" onchange="renderDashboard()">
                </div>
                <div class="flex-1">
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-1">Data Fim</label>
                    <input type="date" id="data-fim" class="w-full bg-black border border-zinc-700 rounded p-3 text-white outline-none focus:border-blue-500" onchange="renderDashboard()">
                </div>
            </div>

            <div class="flex justify-around p-6 bg-zinc-800/50">
                <div class="text-center">
                    <p class="text-sm text-zinc-400 font-bold uppercase mb-1">Total do Período</p>
                    <p id="dash-total-periodo" class="text-4xl text-green-400 font-black">0,00€</p>
                </div>
                <div class="text-center">
                    <p class="text-sm text-zinc-400 font-bold uppercase mb-1">Qtd de Mesas</p>
                    <p id="dash-qtd-mesas" class="text-4xl text-blue-400 font-black">0</p>
                </div>
            </div>

            <!-- GRÁFICOS -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
                <div class="bg-black border border-zinc-800 p-4 rounded-xl flex flex-col">
                    <h3 class="text-center text-zinc-400 font-bold mb-4 uppercase text-sm">Faturamento Diário</h3>
                    <div class="relative w-full h-48"> 
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                <div class="bg-black border border-zinc-800 p-4 rounded-xl flex flex-col items-center">
                    <h3 class="text-center text-zinc-400 font-bold mb-4 uppercase text-sm">Distribuição Mensal</h3>
                    <div class="relative w-48 h-48"> 
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- TABELA COM BOTÃO DE REIMPRESSÃO -->
            <div class="p-6">
                <h3 class="text-zinc-400 font-bold mb-4 uppercase text-sm border-b border-zinc-800 pb-2">Histórico do Período</h3>
                <div class="max-h-64 overflow-y-auto pr-2">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-zinc-500 uppercase text-[10px] border-b border-zinc-800">
                                <th class="pb-2">Data e Hora</th>
                                <th class="pb-2">Mesa</th>
                                <th class="pb-2 text-right">Valor Registado</th>
                                <th class="pb-2 text-center w-24">2ª Via</th>
                            </tr>
                        </thead>
                        <tbody id="dash-tabela-corpo" class="text-sm">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

   <script>
    // ======= COLOQUE AQUI A SUA URL DO APPS SCRIPT =======
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx0Pe6FPM56dQE3axToTZWYnrCbIlG5-lTJS4QgcrlupRYFLmU0NlnfvyrRWaz4-s7z/exec";
    
    let listaPedidos = [];
    let historicoVendas = [];
    let filtradosGlobais = []; 
    let barChartInstance = null;
    let pieChartInstance = null;

    function renderizarCards() {
        const container = document.getElementById('pedidos-container');
        container.innerHTML = '';
        
        if (listaPedidos.length === 0) {
            container.innerHTML = `<div class="col-span-full text-center py-20 text-zinc-600 font-bold uppercase tracking-widest">Nenhuma mesa ativa na cozinha</div>`;
        }

        listaPedidos.forEach((pedido) => {
            const card = document.createElement('div');
            const isPendente = pedido.status === 'Pendente';
            const isEmPreparo = pedido.status === 'Em Preparo';
            const isPronto = pedido.status === 'Pronto';
            const isFinalizado = pedido.status === 'Finalizado';
            
            let statusClass = ''; 
            if(isPendente) statusClass = 'status-pendente new-order-pulse';
            else if(isEmPreparo) statusClass = 'status-preparo';
            else if(isPronto) statusClass = 'status-pronto';
            else if(isFinalizado) statusClass = 'status-finalizado';

            card.className = `card-pedido ${statusClass} shadow-2xl`;
            
            let badgeText = pedido.status.toUpperCase();
            let badgeColor = isFinalizado ? 'text-green-500' : (isPendente ? 'text-amber-500' : (isPronto ? 'text-purple-400' : 'text-blue-500'));

            card.innerHTML = `
                <div class="p-4 bg-zinc-800/50 flex justify-between items-start">
                    <div>
                        <span class="text-xs uppercase font-bold ${badgeColor}">MESA ${pedido.mesa} - ${badgeText}</span>
                        <h2 class="text-lg font-bold">${pedido.cliente || 'Sem Nome'}</h2>
                    </div>
                    <span class="text-xs text-gray-500 font-mono">${pedido.hora}</span>
                </div>
                
                <div class="p-4 space-y-3 min-h-[120px]">
                    ${pedido.itens.map(item => {
                        if (item.cancelado) {
                            return `
                            <div class="flex justify-between border-b border-zinc-800 pb-2 bg-red-900/20 p-2 rounded border border-red-800 opacity-60">
                                <span class="font-medium text-red-500 line-through">1x ${item.nome} (CANCELADO)</span>
                            </div>`;
                        } else {
                            return `
                            <div class="flex justify-between border-b border-zinc-800 pb-2 ${item.novo ? 'bg-amber-900/30 p-2 rounded border border-amber-600 animate-pulse' : ''}">
                                <span class="font-medium ${item.novo ? 'text-amber-400 font-black' : 'text-gray-200'}">
                                    1x ${item.nome} 
                                    ${item.novo ? '<span class="ml-2 bg-amber-500 text-black text-[9px] px-1.5 py-0.5 rounded font-black tracking-widest uppercase shadow-lg">Acrescentado</span>' : ''}
                                </span>
                            </div>`;
                        }
                    }).join('')}
                </div>

                <div class="p-4 bg-zinc-900 flex flex-col gap-2">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-gray-400 uppercase">Total da Mesa</span>
                        <span class="font-bold text-white">${parseFloat(pedido.total).toFixed(2)}€</span>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-2">
                        ${isPendente ? 
                            `<button onclick="alterarStatusServidor('${pedido.mesa}', 'Em Preparo')" class="bg-amber-600 hover:bg-amber-500 text-black font-black py-3 rounded-lg transition w-full">ACEITAR ITENS</button>` 
                            : ''
                        }
                        ${isEmPreparo ? 
                            `<button onclick="alterarStatusServidor('${pedido.mesa}', 'Pronto')" class="bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-lg transition w-full">MARCAR COMO PRONTO</button>` 
                            : ''
                        }
                        ${isPronto ? 
                            `<button disabled class="bg-purple-900/30 text-purple-400 border border-purple-800 font-black py-3 rounded-lg cursor-not-allowed w-full">AGUARDANDO CONTA</button>` 
                            : ''
                        }
                        ${isFinalizado ? 
                            `<button onclick="imprimirEArquivar('${pedido.mesa}')" class="bg-green-600 hover:bg-green-500 text-white font-black py-3 rounded-lg transition w-full flex justify-center items-center gap-2">
                                <i class="fas fa-print"></i> IMPRIMIR E LIMPAR
                            </button>`
                            : ''
                        }
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
        
        document.getElementById('contador-pedidos').innerText = `${listaPedidos.length} ATIVAS`;
    }

    async function buscarPedidosDoServidor() {
        const statusIcon = document.getElementById('status-conexao');
        try {
            statusIcon.innerText = "● Atualizando...";
            const response = await fetch(URL_APPS_SCRIPT);
            const dados = await response.json();
            
            let tocarSom = false;
            const pendentesAgora = dados.pedidos.filter(p => p.status === 'Pendente').length;
            const pendentesAntes = listaPedidos.filter(p => p.status === 'Pendente').length;
            
            if (pendentesAgora > pendentesAntes) {
                tocarSom = true;
            } else {
                dados.pedidos.forEach(pNovo => {
                    if (pNovo.status === 'Pendente') {
                        const pAntigo = listaPedidos.find(p => p.mesa === pNovo.mesa);
                        if (pAntigo && pAntigo.status !== 'Pendente') tocarSom = true;
                    }
                });
            }

            if (tocarSom) {
                const audio = document.getElementById('alert-sound');
                audio.currentTime = 0; 
                audio.play().catch(() => {});
            }
            
            listaPedidos = dados.pedidos;
            historicoVendas = dados.historico || [];
            
            document.getElementById('faturamento-hoje').innerText = parseFloat(dados.faturamento).toFixed(2).replace('.', ',') + '€';
            
            renderizarCards();
            statusIcon.innerText = "● Sincronizado";
            statusIcon.className = "text-xs text-gray-500 uppercase font-bold text-right w-24";
        } catch (error) {
            statusIcon.innerText = "● Erro";
            statusIcon.className = "text-xs text-red-500 uppercase font-bold text-right w-24";
        }
    }

    async function alterarStatusServidor(mesa, novoStatus) {
        const pedidoIndex = listaPedidos.findIndex(p => p.mesa == mesa);
        if (pedidoIndex !== -1) {
            listaPedidos[pedidoIndex].status = novoStatus;
            if (novoStatus === 'Em Preparo') listaPedidos[pedidoIndex].itens.forEach(i => delete i.novo);
            renderizarCards(); 
        }

        try {
            await fetch(URL_APPS_SCRIPT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: "status_cozinha", mesa: mesa, status: novoStatus }) });
        } catch (error) { console.error(error); }
    }

    async function imprimirEArquivar(mesaStr) {
        const p = listaPedidos.find(ped => ped.mesa == mesaStr);
        if(!p) return;

        listaPedidos = listaPedidos.filter(ped => ped.mesa != mesaStr);
        renderizarCards();

        let layout = `
==============================
     BRASA DE MIRAFLORES
     CUPOM DE FECHAMENTO
==============================
MESA: ${p.mesa}
CLIENTE: ${p.cliente || '-'}
DATA/HORA: ${new Date().toLocaleTimeString()}
------------------------------
ITENS CONSUMIDOS:
${p.itens.map(i => {
    if(i.cancelado) return ''; 
    return `- 1x ${i.nome}`;
}).filter(i => i !== '').join('\n')}
------------------------------
TOTAL A PAGAR: ${parseFloat(p.total).toFixed(2)} EUR
==============================`;
        
        await alterarStatusServidor(p.mesa, 'Arquivado');
        
        const win = window.open('', '', 'width=300,height=600');
        win.document.write(`<pre style="font-family: monospace; font-size: 14px; padding:20px;">${layout}</pre>`);
        win.print();
        win.close();
    }

    // =====================================
    // FUNÇÕES DO DASHBOARD (PDF/CSV e 2ª Via)
    // =====================================
    function parseDateData(str) {
        const partes = str.split(' ')[0].split('/');
        return new Date(`${partes[2]}-${partes[1]}-${partes[0]}T00:00:00`);
    }

    function abrirDashboard() {
        document.getElementById('dashboard-modal').style.display = 'block';
        
        let dataInicio = "";
        let dataFim = "";

        if (historicoVendas && historicoVendas.length > 0) {
            let datas = historicoVendas.map(v => parseDateData(v.data));
            datas = datas.filter(d => !isNaN(d.getTime())); 

            if (datas.length > 0) {
                let minDate = new Date(Math.min(...datas));
                let maxDate = new Date(Math.max(...datas));
                
                const yyyyMin = minDate.getFullYear();
                const mmMin = String(minDate.getMonth() + 1).padStart(2, '0');
                const ddMin = String(minDate.getDate()).padStart(2, '0');
                dataInicio = `${yyyyMin}-${mmMin}-${ddMin}`;

                const yyyyMax = maxDate.getFullYear();
                const mmMax = String(maxDate.getMonth() + 1).padStart(2, '0');
                const ddMax = String(maxDate.getDate()).padStart(2, '0');
                dataFim = `${yyyyMax}-${mmMax}-${ddMax}`;
            }
        }

        if (!dataInicio || !dataFim) {
            const hoje = new Date();
            const yyyy = hoje.getFullYear();
            const mm = String(hoje.getMonth() + 1).padStart(2, '0');
            const dd = String(hoje.getDate()).padStart(2, '0');
            dataInicio = `${yyyy}-${mm}-${dd}`;
            dataFim = `${yyyy}-${mm}-${dd}`;
        }

        document.getElementById('data-inicio').value = dataInicio;
        document.getElementById('data-fim').value = dataFim;
        
        renderDashboard();
    }

    function fecharDashboard() { document.getElementById('dashboard-modal').style.display = 'none'; }

    function renderDashboard() {
        const strInicio = document.getElementById('data-inicio').value; 
        const strFim = document.getElementById('data-fim').value; 

        const dtInicio = strInicio ? new Date(strInicio + "T00:00:00") : null;
        const dtFim = strFim ? new Date(strFim + "T23:59:59") : null;

        let totalSoma = 0;
        filtradosGlobais = [];
        let diarioData = {};
        let mensalData = {};
        let idUnico = 0; // Criando um ID seguro para cada linha da tabela

        historicoVendas.forEach(venda => {
            const vendaData = parseDateData(venda.data);
            let incluir = true;
            
            if (dtInicio && vendaData < dtInicio) incluir = false;
            if (dtFim && vendaData > dtFim) incluir = false;

            if (incluir) {
                venda.idTabela = idUnico++; // Salva o ID diretamente na venda
                filtradosGlobais.push(venda);
                let valor = parseFloat(venda.valor);
                totalSoma += valor;

                let diaString = venda.data.split(' ')[0]; 
                diarioData[diaString] = (diarioData[diaString] || 0) + valor;

                let mesString = diaString.substring(3); 
                mensalData[mesString] = (mensalData[mesString] || 0) + valor;
            }
        });

        document.getElementById('dash-total-periodo').innerText = totalSoma.toFixed(2).replace('.', ',') + '€';
        document.getElementById('dash-qtd-mesas').innerText = filtradosGlobais.length;

        const tbody = document.getElementById('dash-tabela-corpo');
        if(filtradosGlobais.length === 0){
            tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-zinc-500 italic">Nenhum registo encontrado.</td></tr>`;
        } else {
            // Agora usamos o ID (v.idTabela) no botão em vez de passar uma string gigantesca que quebra o HTML
            tbody.innerHTML = filtradosGlobais.slice().reverse().map(v => `
                <tr class="border-b border-zinc-800 hover:bg-zinc-800/50 transition">
                    <td class="py-3 text-zinc-300">${v.data}</td>
                    <td class="py-3 font-bold text-white">Mesa ${v.mesa}</td>
                    <td class="py-3 text-right text-green-400 font-bold">${parseFloat(v.valor).toFixed(2).replace('.', ',')}€</td>
                    <td class="py-3 text-center">
                        <button onclick="reimprimirCupomDashboard(${v.idTabela})" class="bg-zinc-700 hover:bg-blue-500 text-white px-3 py-1.5 rounded transition shadow" title="Imprimir 2ª Via">
                            <i class="fas fa-print"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        desenharGraficos(diarioData, mensalData);
    }

    // A função de imprimir agora apenas recebe o ID e procura os dados na memória limpos!
    function reimprimirCupomDashboard(idTabela) {
        const venda = filtradosGlobais.find(v => v.idTabela === idTabela);
        if (!venda) return;

        let itens = [];
        try {
            itens = JSON.parse(venda.itens);
        } catch(e) {}
        
        let layout = `
==============================
     BRASA DE MIRAFLORES
       CUPOM (2ª VIA)
==============================
MESA: ${venda.mesa}
DATA/HORA: ${venda.data}
------------------------------
ITENS CONSUMIDOS:
${itens.map(i => {
    if(i.cancelado) return ''; 
    return `- 1x ${i.nome}`;
}).filter(i => i !== '').join('\n')}
${itens.length === 0 ? '(Nenhum item salvo - Venda Antiga)' : ''}
------------------------------
TOTAL A PAGAR: ${parseFloat(venda.valor).toFixed(2)} EUR
==============================`;
        
        const win = window.open('', '', 'width=300,height=600');
        win.document.write(`<pre style="font-family: monospace; font-size: 14px; padding:20px;">${layout}</pre>`);
        win.print();
        win.close();
    }

    function baixarRelatorio() {
        if(filtradosGlobais.length === 0) {
            alert("Não há dados para exportar neste período.");
            return;
        }

        let csv = "DATA;MESA;VALOR(EUR)\n";
        filtradosGlobais.forEach(v => {
            csv += `${v.data};Mesa ${v.mesa};${parseFloat(v.valor).toFixed(2).replace('.', ',')}\n`;
        });

        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        
        const dtInicio = document.getElementById('data-inicio').value;
        const dtFim = document.getElementById('data-fim').value;
        link.download = `Relatorio_Faturamento_${dtInicio}_A_${dtFim}.csv`;
        
        link.click();
    }

    function desenharGraficos(diarioData, mensalData) {
        if (barChartInstance) barChartInstance.destroy();
        if (pieChartInstance) pieChartInstance.destroy();

        Chart.defaults.color = '#a1a1aa';
        Chart.defaults.font.family = 'Roboto';

        const ctxBar = document.getElementById('barChart').getContext('2d');
        barChartInstance = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: Object.keys(diarioData),
                datasets: [{ label: 'Vendas (€)', data: Object.values(diarioData), backgroundColor: '#3b82f6', borderRadius: 4 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#27272a' } }, x: { grid: { display: false } } }
            }
        });

        const ctxPie = document.getElementById('pieChart').getContext('2d');
        pieChartInstance = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: Object.keys(mensalData),
                datasets: [{ data: Object.values(mensalData), backgroundColor: ['#22c55e', '#eab308', '#f97316', '#a855f7', '#ec4899', '#3b82f6'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
    }

    window.addEventListener('load', () => {
        buscarPedidosDoServidor();
        setInterval(buscarPedidosDoServidor, 8000); 
    });
</script>
</body>
</html>
